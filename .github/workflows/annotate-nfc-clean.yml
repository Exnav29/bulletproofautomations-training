name: Annotate NFC page cleanly

on:
  push:
    branches:
      - docs/nfc-code-comments-clean

permissions:
  contents: write

jobs:
  annotate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/nfc-code-comments-clean
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Add comments without changing executable code
        shell: python
        run: |
          from pathlib import Path

          path = Path("nfc/index.html")
          text = path.read_text()

          inserts = [
              (
                  "<meta charset=\"UTF-8\" />",
                  "<!--\n  PAGE PURPOSE\n  This page opens when someone taps Johnathan's NFC card. It introduces him,\n  collects a small amount of contact/context information, and submits the form\n  directly to an n8n webhook with a normal browser POST.\n\n  The page is deliberately self-contained: its page-specific CSS and JavaScript\n  live here, with no framework dependency.\n-->\n",
              ),
              (
                  "<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\" />",
                  "<!-- Font loading: preconnect first so the browser can establish the Google\n     Fonts connections before requesting the NFC page's three typefaces. -->\n",
              ),
              (
                  "  * { margin: 0; padding: 0; box-sizing: border-box; }",
                  "  /* Global reset: removes browser default spacing and makes element widths\n     include their padding/borders so the layout remains predictable. */\n",
              ),
              (
                  "  .wrap {",
                  "  /* Main content wrapper: centers the experience and caps its width while\n     retaining horizontal breathing room on small screens. */\n",
              ),
              (
                  "  .identity { position: relative; z-index: 1; }",
                  "  /* Identity column: the introduction and role list. z-index keeps this\n     readable above the low-opacity decorative web watermark. */\n",
              ),
              (
                  "  .field { margin-bottom: 18px; }",
                  "  /* Shared form-field spacing. The label/input rules immediately below\n     define the normal text fields used for name, email, and phone. */\n",
              ),
              (
                  "  .checkbox-field {",
                  "  /* Optional email-consent row. It is visually separate from required lead\n     data so submitting the form does not imply marketing consent. */\n",
              ),
              (
                  "  .submit {",
                  "  /* Primary form action. This remains a native HTML submit button; JavaScript\n     does not intercept or rebuild the form payload. */\n",
              ),
              (
                  "  .err {",
                  "  /* Inline error-message styling. The element is present in the markup and\n     becomes visible only if a .show class is applied; browser validation currently\n     handles the required name/email checks. */\n",
              ),
              (
                  "  @keyframes draw     { to { stroke-dashoffset: 0; } }",
                  "  /* Loader animation roles:\n     draw reveals the web strokes; dot-in reveals the center point; word-in fades\n     AKWAABA in; weave slides the kente bar in; loader-out clears the overlay. */\n",
              ),
              (
                  "  (function () {",
                  "  /* Startup IIFE (Immediately Invoked Function Expression): runs before the\n     first paint and decides whether the once-per-session intro animation is allowed. */\n",
              ),
              (
                  "      var seen = sessionStorage.getItem(\"nfc-intro\");",
                  "      // True after this browser session has already shown the NFC intro.\n",
              ),
              (
                  "      var reduced = window.matchMedia(\"(prefers-reduced-motion: reduce)\").matches;",
                  "      // Mirrors the visitor's reduced-motion accessibility preference.\n",
              ),
              (
                  "      if (!seen && !reduced) document.documentElement.classList.add(\"intro\");",
                  "      // The CSS loader only activates when the root <html> element has .intro.\n",
              ),
              (
                  "<div class=\"kente kente--thick\" aria-hidden=\"true\"></div>",
                  "<!-- Decorative opening kente band; aria-hidden keeps it out of the accessibility tree. -->\n",
              ),
              (
                  "<main class=\"wrap\">",
                  "<!-- Main layout: identity/intro content on the left and lead-capture form on the right. -->\n",
              ),
              (
                  "        <!--\n          Backend is handled by a normal browser POST to n8n.\n        -->",
                  "        <!--\n          FORM INTEGRATION CONTRACT\n          The action URL, field names, and hidden values below are consumed by an\n          external n8n workflow. They are integration keys, not presentation text,\n          so changing them requires a matching change in that workflow.\n        -->\n",
              ),
              (
                  "          <input type=\"hidden\" name=\"source\" value=\"nfc-card\" />",
                  "          <!-- Hidden attribution fields travel with every submission so n8n\n               can identify the source, campaign, and entry page. -->\n",
              ),
              (
                  "          <div class=\"field\">\n            <label for=\"name\">Your name</label>",
                  "          <!-- Required identity field used to address the visitor in follow-up. -->\n",
              ),
              (
                  "          <div class=\"field\">\n            <label for=\"email\">Email</label>",
                  "          <!-- Required reply address; type=email gives us browser-level format validation. -->\n",
              ),
              (
                  "          <div class=\"field\">\n            <label for=\"phone\">Phone / WhatsApp <span class=\"opt\">(optional)</span></label>",
                  "          <!-- Optional phone/WhatsApp contact; autocomplete is helpful on mobile. -->\n",
              ),
              (
                  "          <div class=\"field\">\n            <label id=\"looking-label\">What are you looking for?</label>",
                  "          <!-- Required intent choice. Its radio value tells the downstream n8n\n               workflow which resource/follow-up path best matches the visitor. -->\n",
              ),
              (
                  "          <p class=\"err\" id=\"form-err\" role=\"alert\">",
                  "          <!-- Accessible inline error container reserved for custom validation. -->\n",
              ),
              (
                  "          <label class=\"checkbox-field\">",
                  "          <!-- Explicit, optional marketing opt-in. The lead request still submits\n               when this box is left unchecked. -->\n",
              ),
              (
                  "          <button type=\"submit\" class=\"submit\">",
                  "          <!-- Native submit: the browser posts the exact form fields above to n8n. -->\n",
              ),
              (
                  "<div class=\"kente\" aria-hidden=\"true\"></div>",
                  "<!-- Decorative closing band mirrors the opening kente strip. -->\n",
              ),
              (
                  "  if (document.documentElement.classList.contains(\"intro\")) {",
                  "  /* Intro cleanup: only runs when the startup IIFE enabled the animation.\n     It records that the intro has played and later removes the loader from the DOM. */\n",
              ),
              (
                  "    try { sessionStorage.setItem(\"nfc-intro\", \"1\"); } catch (e) {}",
                  "    // Storage failure is harmless; the only consequence is that the intro may replay.\n",
              ),
              (
                  "    setTimeout(() => { const l = document.querySelector(\".loader\"); if (l) l.remove(); }, 3000);",
                  "    // Delayed callback runs after the CSS exit animation and removes the fixed overlay.\n",
              ),
              (
                  "  const campaign = new URLSearchParams(window.location.search).get(\"campaign\");",
                  "  /* Campaign override: a URL such as /nfc?campaign=conference-name replaces\n     the default hidden campaign value. With no query parameter, n8n-ambassador stays in place. */\n",
              ),
              (
                  "  if (campaign) document.querySelector('input[name=\"campaign\"]').value = campaign;",
                  "  // Only overwrite the hidden field when a non-empty campaign parameter exists.\n",
              ),
          ]

          for marker, comment in inserts:
              if marker not in text:
                  raise SystemExit(f"Expected NFC marker not found: {marker[:160]}")
              text = text.replace(marker, comment + marker, 1)

          path.write_text(text)

      - name: Prove comments-only and protected form contract
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          text = Path("nfc/index.html").read_text()
          required = [
              'action="https://n8n.bulletproofautomations.com/webhook/nfc-lead-capture"',
              'name="name"', 'name="email"', 'name="phone"',
              'name="looking_for"', 'name="email_opt_in"',
              'name="source" value="nfc-card"',
              'name="campaign" value="n8n-ambassador"',
              'name="entry_page" value="/nfc"',
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f"Protected NFC form contract changed: {missing}")

          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "HEAD", "--", "nfc/index.html"],
              text=True,
          )
          removed = [line for line in diff.splitlines()
                     if line.startswith("-") and not line.startswith("---")]
          if removed:
              raise SystemExit("Comments-only check failed; original source lines were removed")

      - name: Build and validate deployed output
        run: |
          npm run build
          npx --yes html-validate "dist/**/*.html"

      - name: Commit comments and remove helper workflow
        run: |
          git config user.name "Johnathan Lightfoot"
          git config user.email "6110821+Exnav29@users.noreply.github.com"
          git rm .github/workflows/annotate-nfc-clean.yml
          git add nfc/index.html
          git commit -m "Document NFC page code"
          git push origin HEAD:docs/nfc-code-comments-clean