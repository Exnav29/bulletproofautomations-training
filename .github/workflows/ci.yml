name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pages are assembled from partials/ at build time, so validate the built
      # output rather than the source fragments. This also checks what ships.
      - name: Build
        run: npm run build
      - name: Validate HTML
        run: npx --yes html-validate "dist/**/*.html"

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --base-url https://training.bulletproofautomations.com
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --accept '100..=103,200..=299,403'
            --exclude '^https://n8n\.bulletproofautomations\.com/webhook/nfc-lead-capture$'
            './dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{ github.token }}
