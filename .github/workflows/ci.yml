name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  html-validate:
    name: HTML validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Pages are assembled from partials/ at build time, so validate the built
      # output rather than the source fragments. This also checks what ships.
      - name: Build
        run: npm run build
      - name: Validate HTML
        run: npx --yes html-validate "dist/**/*.html"
      - name: Check admin JavaScript and certificate archive
        run: |
          node --check assets/js/admin-studio.js
          node --check assets/js/admin.js
          node --check assets/js/admin-archives.js
          node --check assets/js/admin-previews.js
          node --check assets/js/shell.js
          node --test tests/*.test.js

  certificate-renderer:
    name: Server PDF renderer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.4
      - name: Install pinned Studio test dependencies
        run: |
          npm ci --prefix supabase/functions/certificate-studio --ignore-scripts
          ln -s supabase/functions/certificate-studio/node_modules node_modules
      - name: Studio authorization and PostgreSQL state machine
        run: |
          deno check --node-modules-dir=manual supabase/functions/certificate-studio/index.ts
          deno test --node-modules-dir=manual --allow-env tests/studio-auth.test.ts
          deno run --node-modules-dir=manual --allow-read --allow-env tests/studio-db.test.mjs
          node tests/studio-ui.test.mjs
      - name: Render real PDFs and reject invalid inputs
        run: deno test --node-modules-dir=none --allow-net --allow-read --allow-env tests/certificate-renderer.test.ts

  link-check:
    name: Link check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build
        run: npm run build
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --base-url https://training.bulletproofautomations.com
            --verbose
            --no-progress
            --max-retries 3
            --retry-wait-time 2
            --accept '100..=103,200..=299,403'
            --exclude '^https://n8n\.bulletproofautomations\.com/webhook/nfc-lead-capture$'
            './dist/**/*.html'
        env:
          GITHUB_TOKEN: ${{ github.token }}
