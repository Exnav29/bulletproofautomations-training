name: Fix NFC annotation verifier

on:
  push:
    branches:
      - docs/nfc-code-comments

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/nfc-code-comments
      - name: Make comments-only check semantic
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/annotate-nfc.yml')
          text = path.read_text()

          old_read = '''          path = Path("nfc/index.html")
          text = path.read_text()

          replacements = ['''
          new_read = '''          path = Path("nfc/index.html")
          text = path.read_text()
          Path("/tmp/nfc-before.html").write_text(text)

          replacements = ['''
          if old_read not in text:
              raise SystemExit('Could not find NFC source-read marker')
          text = text.replace(old_read, new_read, 1)

          old_check = '''          # This task is comments-only. Any removed source line means behavior or
          # markup was altered instead of merely documented.
          import subprocess
          diff = subprocess.check_output(
              ["git", "diff", "--unified=0", "HEAD", "--", "nfc/index.html"],
              text=True,
          )
          removed = [
              line for line in diff.splitlines()
              if line.startswith("-") and not line.startswith("---")
          ]
          if removed:
              raise SystemExit("Comments-only invariant failed; source lines were removed:\\n" + "\\n".join(removed[:20]))'''
          new_check = '''          # Compare the page before/after with HTML, block, and whole-line JS
          # comments removed. Collapsing whitespace lets us expand an existing
          # one-line comment into a readable multi-line comment without treating
          # that formatting as a behavior change.
          import re

          before = Path("/tmp/nfc-before.html").read_text()
          after = text

          def without_comments(source):
              source = re.sub(r"<!--.*?-->", "", source, flags=re.S)
              source = re.sub(r"/\\*.*?\\*/", "", source, flags=re.S)
              source = re.sub(r"^\\s*//.*$", "", source, flags=re.M)
              return re.sub(r"\\s+", " ", source).strip()

          if without_comments(before) != without_comments(after):
              raise SystemExit("Comments-only invariant failed: executable or markup content changed")'''
          if old_check not in text:
              raise SystemExit('Could not find strict comments-only verifier block')
          text = text.replace(old_check, new_check, 1)
          path.write_text(text)

      - name: Commit verifier fix and remove this helper
        run: |
          git config user.name "Johnathan Lightfoot"
          git config user.email "6110821+Exnav29@users.noreply.github.com"
          git rm .github/workflows/fix-nfc-verifier.yml
          git add .github/workflows/annotate-nfc.yml
          git commit -m "Fix NFC comments-only verifier"
          git push origin HEAD:docs/nfc-code-comments