name: Live certificate verification smoke

on:
  pull_request:
    paths:
      - '.github/workflows/credential-verification-smoke.yml'
      - 'functions/api/verify.js'
      - 'functions/verify/**'
      - 'assets/js/shell.js'
      - 'verify/index.html'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  published-foundations-lookup:
    name: Existing credential deep-link and API
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the production website using an already-issued Foundations credential
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'https://training.bulletproofautomations.com';
          // This is an already-published Foundations identifier, never an Intermediate ID.
          const id = 'BPA-FND-2026-WHXRTT';
          const timeout = AbortSignal.timeout(18000);
          const response = await fetch(base + '/verify/' + id, {
            signal: timeout,
            headers: { Accept: 'text/html' },
            redirect: 'follow'
          });
          assert.equal(response.status, 200, 'Public deep link must return HTTP 200');
          const page = await response.text();
          assert.ok(page.includes('credential-list') && page.includes('Verification result'),
            'Deep link must serve the actual credential verification page');
          const lookup = await fetch(base + '/api/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ id }),
            signal: AbortSignal.timeout(18000)
          });
          assert.equal(lookup.status, 200, 'ID verification endpoint must succeed without Turnstile');
          const result = await lookup.json();
          assert.equal(result.ok, true);
          assert.ok(Array.isArray(result.results), 'Endpoint must return a credential collection');
          assert.ok(result.results.some(x => x.credentialId === id && x.credential === 'foundations' && x.status === 'valid'),
            'Existing Foundations credential must be verifiable');
          console.log('Public certificate deep-link, API, and previously issued record passed.');
          console.log('Name lookup requires human Turnstile and remains separately verified by database RPC.');
          JS
