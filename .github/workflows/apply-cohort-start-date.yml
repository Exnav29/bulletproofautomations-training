name: Apply confirmed cohort start date

on:
  push:
    branches:
      - cohort-start-oct-3

permissions:
  contents: write

jobs:
  apply-date:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: cohort-start-oct-3
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update confirmed date everywhere
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "index.html": [
                  ("The founding Intermediate cohort has been postponed and its revised start date is being confirmed.", "The founding Intermediate cohort starts Saturday, 3 October 2026."),
                  ("Enroll &mdash; revised cohort date being confirmed", "Enroll &mdash; cohort starts 3 October"),
                  ('<p class="event__date">Revised date</p>', '<p class="event__date"><time datetime="2026-10-03">Sat 3 Oct</time></p>'),
                  ("25 seats. The revised start date is being confirmed with the cohort.", "25 seats. The cohort starts Saturday 3 October 2026."),
                  ("Enrollment closes with the revised start date.", "Enrollment is open now."),
                  ("Cohort 1 finished on 5 September. The Intermediate cohort has been postponed and its revised start date is being confirmed.", "Cohort 1 finished on 5 September. The Intermediate cohort starts Saturday 3 October 2026."),
              ],
              "intermediate-cohort/index.html": [
                  ('<div><dt>Starts</dt><dd>Revised date being confirmed</dd></div>', '<div><dt>Starts</dt><dd><time datetime="2026-10-03">Saturday, 3 October 2026</time></dd></div>'),
              ],
              "certified-automation-builder/index.html": [
                  ('<div><dt>Starts</dt><dd>Revised date being confirmed</dd></div>', '<div><dt>Starts</dt><dd><time datetime="2026-10-03">Saturday, 3 October 2026</time></dd></div>'),
                  ('<div><dt>Enrollment closes</dt><dd>To be confirmed with the revised start date</dd></div>', '<div><dt>Enrollment closes</dt><dd>To be announced</dd></div>'),
              ],
              "assets/js/admin.js": [
                  ('var COHORT_STARTS = null;', 'var COHORT_STARTS = "2026-10-03";'),
                  ('<p class="board__sub">Final date set after the 23 September webinar</p>', '<p class="board__sub">Saturday 3 October 2026</p>'),
              ],
              "docs/design-plan-intermediate-cohort.md": [
                  ('4. **Use the existing `.placeholder` treatment for the unconfirmed start date.** An unconfirmed fact should render as an explicit placeholder state rather than plain factual text.', '4. **Use the confirmed cohort start date.** The Intermediate cohort starts Saturday, 3 October 2026. Render it as a factual `<time>` value rather than a placeholder state.'),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in pairs:
                  if old not in text:
                      raise SystemExit(f"Expected text not found in {filename}: {old}")
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f"No change made to {filename}")
              path.write_text(text)

          checks = {
              "index.html": ["revised cohort date being confirmed", "revised start date is being confirmed", ">Revised date<"],
              "intermediate-cohort/index.html": ["Revised date being confirmed"],
              "certified-automation-builder/index.html": ["Revised date being confirmed", "confirmed with the revised start date"],
              "assets/js/admin.js": ["Final date set after the 23 September webinar", "COHORT_STARTS = null"],
          }
          for filename, stale_terms in checks.items():
              text = Path(filename).read_text()
              for term in stale_terms:
                  if term in text:
                      raise SystemExit(f"Stale date text remains in {filename}: {term}")

      - name: Build and validate
        run: |
          npm run build
          npx --yes html-validate "dist/**/*.html"
      - name: Commit source updates and remove helper workflow
        run: |
          git config user.name "Johnathan Lightfoot"
          git config user.email "6110821+Exnav29@users.noreply.github.com"
          git rm .github/workflows/apply-cohort-start-date.yml
          git add index.html intermediate-cohort/index.html certified-automation-builder/index.html assets/js/admin.js docs/design-plan-intermediate-cohort.md
          git commit -m "Set Intermediate cohort start date to October 3"
          git push origin HEAD:cohort-start-oct-3
