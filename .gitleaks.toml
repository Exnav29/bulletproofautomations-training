title = "Bulletproof Automations Training gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = """Historical only. assets/js/main.js was deleted on 11 August 2026 with the
legacy routes it served, but gitleaks scans FULL HISTORY, so the commits that contained it are
still scanned and this allowlist is still required. Removing it would make CI start failing on
old commits rather than tidy anything up.

The value is the OLD project's anon key. Anon keys are public by design — they reach every
visitor's browser and row-level security is what protects the data — so this was never a
secret. Current code carries no key at all: build-time tokens are substituted from the
environment, which is why no new allowlist entry has been needed."""
paths = ['''^assets/js/main\.js$''']
regexTarget = "match"
regexes = [
  '''eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ0cWNleHp3cHBjb3pweWp3ZnFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkwMjU3MzgsImV4cCI6MjA5NDYwMTczOH0\.Jj-eu6XMcPfAgZ91kSTpAYs1zlQNM95HvgdXgEoBR2w''',
]
