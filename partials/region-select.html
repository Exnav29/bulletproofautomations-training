<!-- Country selector for regional pricing.
     Authored once here and included wherever a price needs correcting, so the
     pages cannot drift apart.

     A REAL FORM, deliberately. method="get" means choosing a country reloads
     the page with ?country=XX; the middleware turns that into a cookie and
     redirects the parameter away, so the choice persists across pages and
     never survives in the address bar or in a shared link. It therefore works
     with JavaScript disabled, on a failed script load, and on a slow
     connection. shell.js only submits on change and hides the button.

     DELIBERATELY UNDERSTATED. This is a correction for people whose location
     was read wrongly - travel, VPNs, living in one country and earning in
     another - not a menu of prices to shop. It sits quietly beside the prices
     rather than inviting comparison.

     Each option carries a flag AND a name. Flag alone is not enough: Windows
     ships no flag glyphs and renders the pair as two letters, and a flag on
     its own is unreadable to a screen reader and to anyone who does not
     recognise it.

     Nothing chosen here can buy a cheaper price. A declaration that lowers the
     tier reserves the place and takes no payment until a person confirms it -
     see functions/api/enroll.js. -->
<form class="region" method="get" action="{{action}}" data-region-form>
  <p class="region__prompt">Select your country to see the correct regional rate.</p>
  <label class="region__label" for="region-country">Prices shown for</label>
